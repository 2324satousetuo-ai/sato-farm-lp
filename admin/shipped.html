<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>発送済み一覧 | 佐藤農園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F1E1;
    --ink: #2B2A22;
    --ink-soft: #5B5646;
    --gold: #B8862F;
    --gold-deep: #8C6420;
    --green: #3F5C3E;
    --green-soft: #E7ECDD;
    --error: #A8402A;
    --line: rgba(43, 42, 34, 0.14);
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 90px;
  }

  header { text-align: center; margin-bottom: 32px; }

  header h1 {
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.05em;
    margin: 0 0 6px;
  }
  header p { font-size: 13px; color: var(--ink-soft); margin: 0; }

  #loginGate {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 28px;
    max-width: 380px;
    margin: 60px auto 0;
    text-align: center;
  }
  #loginGate p { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; }
  #loginGate input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 15px;
    margin-bottom: 12px;
    background: var(--paper);
    color: var(--ink);
  }
  #loginGate input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  #loginGate button {
    width: 100%;
    padding: 12px;
    background: var(--gold-deep);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  #loginGate button:hover { background: #74530F; }
  #loginError { color: var(--error); font-size: 12px; margin-top: 10px; display: none; }
  #loginError.show { display: block; }

  #main { display: none; }
  #main.show { display: block; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .toolbar-actions {
    display: flex;
    gap: 10px;
    margin-left: auto;
  }
  .toolbar button,
  .toolbar a {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
  }
  .toolbar button:hover,
  .toolbar a:hover { border-color: var(--gold); color: var(--ink); }

  section.group { margin-bottom: 28px; }

  .group-title {
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-count {
    font-size: 12px;
    background: var(--green-soft);
    color: var(--green);
    border-radius: 100px;
    padding: 2px 10px;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 500;
  }
  .group-note {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }

  .order-card {
    background: #fff;
    border: 1px solid var(--line);
    border-left: 3px solid var(--ink-soft);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }

  .order-info { flex: 1; min-width: 220px; }
  .order-info .oid {
    font-family: "Shippori Mincho", serif;
    font-size: 13px;
    color: var(--gold-deep);
    margin-bottom: 4px;
  }
  .order-info .member { font-size: 15px; font-weight: 500; }
  .order-info .shipping {
    font-size: 13px;
    color: var(--ink);
    margin-top: 6px;
    line-height: 1.55;
  }
  .order-info .shipping-missing { color: var(--ink-soft); }
  .order-info .product { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .order-info .notes { font-size: 13px; color: var(--ink); margin-top: 8px; white-space: pre-wrap; }
  .order-info .date { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }

  .order-amount {
    font-family: "Shippori Mincho", serif;
    font-size: 18px;
    color: var(--ink);
    white-space: nowrap;
  }

  .order-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    min-width: 180px;
  }

  .tracking-field {
    width: 100%;
    min-width: 160px;
  }
  .tracking-field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 16px;
    font-family: inherit;
    background: var(--paper);
    color: var(--ink);
  }
  .tracking-field input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  .save-btn {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .save-btn:hover:not(:disabled) { background: #2E452E; }
  .save-btn:disabled { background: #C9C2AC; cursor: not-allowed; }

  .empty-note {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    padding: 24px 0;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>発送済み一覧</h1>
    <p>発送が終わった注文の確認と、追跡番号の記録</p>
  </header>

  <div id="loginGate">
    <p>管理用パスワードを入力してください</p>
    <input type="password" id="secretInput" placeholder="パスワード" autocomplete="off">
    <button id="loginBtn">ログイン</button>
    <p id="loginError">パスワードが正しくありません</p>
  </div>

  <div id="main">
    <div class="toolbar">
      <a href="/admin.html">管理画面へ戻る</a>
      <div class="toolbar-actions">
        <button id="refreshBtn">一覧を更新</button>
        <button id="logoutBtn">ログアウト</button>
      </div>
    </div>

    <section class="group">
      <div class="group-title">
        発送済み
        <span class="group-count" id="shippedCount">0</span>
      </div>
      <p class="group-note">追跡番号の保存では、発送メールは再送しません。</p>
      <div id="shippedList"></div>
    </section>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API_BASE = "";
const STORAGE_KEY = "satofarms_admin_secret";

function readAdminSecret() {
  try {
    return sessionStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY) || "";
  } catch {
    return "";
  }
}

function saveAdminSecret(secret) {
  sessionStorage.setItem(STORAGE_KEY, secret);
  try { localStorage.setItem(STORAGE_KEY, secret); } catch { /* ignore */ }
}

function clearAdminSecret() {
  sessionStorage.removeItem(STORAGE_KEY);
  try { localStorage.removeItem(STORAGE_KEY); } catch { /* ignore */ }
}

let adminSecret = readAdminSecret();

const el = (id) => document.getElementById(id);
const yen = (n) => "¥" + Number(n).toLocaleString("ja-JP");

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function shippingHtml(order) {
  const postal = order.shipping_postal_code ? "〒" + order.shipping_postal_code : "";
  const line = [postal, order.shipping_prefecture, order.shipping_address]
    .filter(Boolean)
    .join(" ");
  const parts = [];
  if (line) parts.push(escapeHtml(line));
  if (order.shipping_phone) parts.push("TEL " + escapeHtml(order.shipping_phone));
  if (!parts.length) {
    return '<span class="shipping-missing">注文時の届け先が記録されていません</span>';
  }
  return parts.join("<br>");
}

function showToast(message) {
  const t = el("toast");
  t.textContent = message;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2400);
}

function formatDate(iso) {
  if (!iso) return "";
  return iso.replace("T", " ").slice(0, 16);
}

async function tryLogin(secret) {
  const res = await fetch(API_BASE + "/api/admin/orders/shipped", {
    headers: { "X-Admin-Secret": secret },
  });
  if (res.status === 401) return false;
  const data = await res.json();
  if (!data.success) return false;
  return true;
}

el("loginBtn").addEventListener("click", async () => {
  const secret = el("secretInput").value.trim();
  if (!secret) return;
  el("loginBtn").disabled = true;
  el("loginBtn").textContent = "確認しています…";

  const ok = await tryLogin(secret);
  el("loginBtn").disabled = false;
  el("loginBtn").textContent = "ログイン";

  if (!ok) {
    el("loginError").classList.add("show");
    return;
  }
  el("loginError").classList.remove("show");
  adminSecret = secret;
  saveAdminSecret(secret);
  showMain();
});

el("secretInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") el("loginBtn").click();
});

el("logoutBtn").addEventListener("click", () => {
  adminSecret = "";
  clearAdminSecret();
  el("main").classList.remove("show");
  el("loginGate").style.display = "block";
  el("secretInput").value = "";
});

async function showMain() {
  el("loginGate").style.display = "none";
  el("main").classList.add("show");
  await loadOrders();
}

async function loadOrders() {
  try {
    const res = await fetch(API_BASE + "/api/admin/orders/shipped", {
      headers: { "X-Admin-Secret": adminSecret },
    });
    if (res.status === 401) {
      showToast("認証が切れました。再度ログインしてください。");
      el("logoutBtn").click();
      return;
    }
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    renderOrders(data.orders || []);
  } catch (err) {
    showToast("一覧の取得に失敗しました");
  }
}

const BROWN_SOURCE_LABEL = {
  "30kg": "玄米30kg",
  "20kg相当": "玄米20kg",
  "15kg相当": "玄米15kg",
  "10kg相当": "玄米10kg",
};

const MILLED_YIELD_KG = {
  "30kg": 27,
  "20kg相当": 18,
  "15kg相当": 13.5,
  "10kg相当": 9,
};

const BROWN_ACTUAL_KG = {
  "30kg": 30,
  "20kg相当": 19.5,
  "15kg相当": 14.5,
  "10kg相当": 9.5,
};

function productLabel(order) {
  if (!order.milled) {
    if (order.weight_label === "30kg") return "玄米30kg";
    const actual = order.actual_weight_kg ?? BROWN_ACTUAL_KG[order.weight_label];
    return "玄米" + order.weight_label + "(実質" + actual + "kg)";
  }
  const yieldKg = MILLED_YIELD_KG[order.weight_label];
  const brown = BROWN_SOURCE_LABEL[order.weight_label] || "玄米" + order.weight_label;
  return "標準精米（白米）実質" + yieldKg + "kg(" + brown + "を精米)";
}

function renderOrders(orders) {
  el("shippedCount").textContent = orders.length;

  const list = el("shippedList");
  list.innerHTML = orders.length
    ? ""
    : '<p class="empty-note">発送済みの注文はありません。</p>';

  for (const o of orders) {
    const card = document.createElement("div");
    card.className = "order-card";
    const notes = o.notes ? String(o.notes).trim() : "";
    const notesHtml = notes
      ? `<div class="notes">備考：${escapeHtml(notes)}</div>`
      : "";
    const tracking = o.tracking_number ? String(o.tracking_number) : "";
    card.innerHTML = `
      <div class="order-info">
        <div class="oid">No.${escapeHtml(o.id)}</div>
        <div class="member">${escapeHtml(o.recipient_name || "（宛名なし）")}</div>
        <div class="shipping">${shippingHtml(o)}</div>
        <div class="product">${escapeHtml(productLabel(o))}</div>
        ${notesHtml}
        <div class="date">注文日時：${escapeHtml(formatDate(o.ordered_at))}</div>
        <div class="date">発送日時：${escapeHtml(formatDate(o.ship_date) || "（未記録）")}</div>
      </div>
      <div class="order-side">
        <div class="order-amount">${yen(o.total_amount)}</div>
        <label class="tracking-field">
          <input class="tracking-input" type="text" inputmode="numeric" autocomplete="off" maxlength="40" placeholder="追跡番号" aria-label="追跡番号" value="${escapeHtml(tracking)}">
        </label>
        <button class="save-btn" data-id="${escapeHtml(o.id)}">保存</button>
      </div>
    `;
    list.appendChild(card);
  }

  document.querySelectorAll(".save-btn").forEach((btn) => {
    btn.addEventListener("click", () => saveTracking(btn.dataset.id, btn));
  });
  document.querySelectorAll(".tracking-input").forEach((input) => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const btn = input.closest(".order-card").querySelector(".save-btn");
        if (btn) saveTracking(btn.dataset.id, btn);
      }
    });
  });
}

async function saveTracking(orderId, btn) {
  const card = btn.closest(".order-card");
  const trackingInput = card && card.querySelector(".tracking-input");
  const trackingNumber = trackingInput ? trackingInput.value.trim() : "";

  btn.disabled = true;
  btn.textContent = "保存中…";

  try {
    const res = await fetch(API_BASE + `/api/admin/orders/${orderId}/tracking`, {
      method: "POST",
      headers: {
        "X-Admin-Secret": adminSecret,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ trackingNumber }),
    });
    if (res.status === 401) {
      showToast("認証が切れました。再度ログインしてください。");
      el("logoutBtn").click();
      return;
    }
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "保存に失敗しました");

    showToast(data.message || `注文 No.${orderId} の追跡番号を保存しました`);
  } catch (err) {
    showToast(err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "保存";
  }
}

el("refreshBtn").addEventListener("click", loadOrders);

(async function init() {
  if (adminSecret) {
    const ok = await tryLogin(adminSecret);
    if (ok) {
      saveAdminSecret(adminSecret);
      showMain();
      return;
    }
    clearAdminSecret();
    adminSecret = "";
  }
})();
</script>

</body>
</html>
