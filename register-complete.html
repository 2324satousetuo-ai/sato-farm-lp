<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登録完了｜佐藤農園</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="thank-you-page">
    <div class="container container--narrow">
      <div class="form-success">
        <p class="form-success__icon" aria-hidden="true">✓</p>
        <h1>登録ありがとうございました</h1>
        <p>佐藤農園のお米にご関心をお寄せいただき、ありがとうございます。<br>販売の準備が整いましたら、ご登録のご連絡先へご案内します。</p>

        <div class="form-success__line" id="line-friend-section">
          <p class="form-success__line-lead">佐藤農園のLINE公式アカウントを友だち追加していただくと、生育レポートなどのお知らせをいち早くお届けできます。（任意）</p>
          <a id="line-friend-btn" class="btn btn--line" href="#" hidden>LINE友だち追加</a>
        </div>

        <a href="index.html" class="btn btn--primary">トップページへ戻る</a>
      </div>
    </div>
  </main>
  <script src="line-friend.config.js"></script>
  <script>
    (function () {
      var config = window.SATO_FARM_LINE_FRIEND || {};
      var url = String(config.addFriendUrl || '').trim();
      var button = document.getElementById('line-friend-btn');
      if (!button || !url) {
        return;
      }
      button.href = url;
      button.hidden = false;
      button.setAttribute('target', '_blank');
      button.setAttribute('rel', 'noopener noreferrer');
    })();
  </script>
</body>
</html>
