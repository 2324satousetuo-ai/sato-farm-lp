<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 | 佐藤農園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F1E1;
    --ink: #2B2A22;
    --ink-soft: #5B5646;
    --gold: #B8862F;
    --gold-deep: #8C6420;
    --green: #3F5C3E;
    --green-soft: #E7ECDD;
    --error: #A8402A;
    --line: rgba(43, 42, 34, 0.14);
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 90px;
  }

  header { text-align: center; margin-bottom: 32px; }

  header h1 {
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.05em;
    margin: 0 0 6px;
  }
  header p { font-size: 13px; color: var(--ink-soft); margin: 0; }

  #loginGate {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 28px;
    max-width: 380px;
    margin: 60px auto 0;
    text-align: center;
  }
  #loginGate p { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; }
  #loginGate input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 15px;
    margin-bottom: 12px;
    background: var(--paper);
    color: var(--ink);
  }
  #loginGate input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  #loginGate button {
    width: 100%;
    padding: 12px;
    background: var(--gold-deep);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  #loginGate button:hover { background: #74530F; }
  #loginError { color: var(--error); font-size: 12px; margin-top: 10px; display: none; }
  #loginError.show { display: block; }

  #main { display: none; }
  #main.show { display: block; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .toolbar-actions {
    display: flex;
    gap: 10px;
    margin-left: auto;
  }
  .toolbar button,
  .toolbar a {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
  }
  .toolbar button:hover,
  .toolbar a:hover { border-color: var(--gold); color: var(--ink); }

  section.group { margin-bottom: 28px; }

  .group-title {
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-count {
    font-size: 12px;
    background: var(--green-soft);
    color: var(--green);
    border-radius: 100px;
    padding: 2px 10px;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 500;
  }

  .order-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }

  .order-card.pending { border-left: 3px solid var(--gold); }
  .order-card.preparing { border-left: 3px solid var(--green); }

  .order-info { flex: 1; min-width: 220px; }
  .order-info .oid {
    font-family: "Shippori Mincho", serif;
    font-size: 13px;
    color: var(--gold-deep);
    margin-bottom: 4px;
  }
  .order-info .member { font-size: 15px; font-weight: 500; }
  .order-info .shipping {
    font-size: 13px;
    color: var(--ink);
    margin-top: 6px;
    line-height: 1.55;
  }
  .order-info .shipping-missing { color: var(--ink-soft); }
  .order-info .product { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .order-info .notes { font-size: 13px; color: var(--ink); margin-top: 8px; white-space: pre-wrap; }
  .order-info .date { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }

  .order-amount {
    font-family: "Shippori Mincho", serif;
    font-size: 18px;
    color: var(--ink);
    white-space: nowrap;
  }

  .confirm-btn {
    background: var(--gold-deep);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .confirm-btn:hover:not(:disabled) { background: #74530F; }
  .confirm-btn:disabled { background: #C9C2AC; cursor: not-allowed; }

  .order-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .print-btn {
    display: inline-block;
    text-align: center;
    text-decoration: none;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 18px;
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .print-btn:hover { border-color: var(--gold); color: var(--ink); }

  .complete-btn {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .complete-btn:hover:not(:disabled) { background: #2E452E; }
  .complete-btn:disabled { background: #C9C2AC; cursor: not-allowed; }

  .tracking-field {
    width: 100%;
    min-width: 160px;
  }
  .tracking-field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 16px;
    font-family: inherit;
    background: var(--paper);
    color: var(--ink);
  }
  .tracking-field input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  .status-tag {
    font-size: 11px;
    background: var(--green-soft);
    color: var(--green);
    border-radius: 100px;
    padding: 4px 12px;
    white-space: nowrap;
  }

  .member-counts {
    font-size: 12px;
    color: var(--ink-soft);
    margin: -4px 0 12px;
  }

  .order-card.member { border-left: 3px solid var(--ink-soft); }
  .order-card.offer { border-left: 3px solid var(--gold); }

  .offer-campaign-select {
    width: 100%;
    margin: 0 0 12px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
  }
  .offer-campaign-select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  .empty-note {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    padding: 24px 0;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }

  .email-preview {
    position: fixed;
    inset: 0;
    background: rgba(43, 42, 34, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
  }
  .email-preview[hidden] { display: none; }
  .email-preview-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px 22px;
    max-width: 520px;
    width: 100%;
    max-height: min(80vh, 640px);
    overflow: auto;
  }
  .email-preview-card h2 {
    font-family: "Shippori Mincho", serif;
    font-size: 18px;
    margin: 0 0 8px;
  }
  .email-preview-card .email-preview-note {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }
  .email-preview-card .email-preview-subject {
    font-size: 13px;
    font-weight: 700;
    margin: 0 0 10px;
  }
  .email-preview-card pre {
    white-space: pre-wrap;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 16px;
    background: var(--paper);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .email-preview-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 16px;
  }
  .email-preview-links a {
    display: inline-block;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    text-decoration: none;
    font-size: 13px;
    background: #fff;
  }
  .email-preview-links a:hover { border-color: var(--gold); }
  .email-preview-card button {
    width: 100%;
    padding: 11px;
    background: var(--gold-deep);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .email-preview-card button:hover { background: #74530F; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>佐藤農園 管理画面</h1>
    <p>入金確認・注文状況・事前登録者の確認</p>
  </header>

  <div id="loginGate">
    <p>管理用パスワードを入力してください</p>
    <input type="password" id="secretInput" placeholder="パスワード" autocomplete="off">
    <button id="loginBtn">ログイン</button>
    <p id="loginError">パスワードが正しくありません</p>
  </div>

  <div id="main">
    <div class="toolbar">
      <a href="/admin/shipped.html">発送済み一覧</a>
      <div class="toolbar-actions">
        <button id="refreshBtn">一覧を更新</button>
        <button id="logoutBtn">ログアウト</button>
      </div>
    </div>

    <section class="group">
      <div class="group-title">
        支払い待ち
        <span class="group-count" id="pendingCount">0</span>
      </div>
      <div id="pendingList"></div>
    </section>

    <section class="group">
      <div class="group-title">
        発送準備中（入金確認済み）
        <span class="group-count" id="preparingCount">0</span>
      </div>
      <div id="preparingList"></div>
    </section>

    <section class="group">
      <div class="group-title">
        事前登録者
        <span class="group-count" id="memberCount">0</span>
      </div>
      <p class="member-counts">
        Lv.1 <span id="lv1Count">0</span>
        　／　Lv.2 <span id="lv2Count">0</span>
        　／　Lv.3 <span id="lv3Count">0</span>
      </p>
      <div id="memberList"></div>
    </section>

    <section class="group">
      <div class="group-title">価格案内</div>
      <p class="member-counts" id="offerPreview">送信対象を読み込んでいます…</p>
      <p class="member-counts" id="offerLastSend"></p>
      <button type="button" class="confirm-btn" id="sendLv3OfferBtn">Lv.3へ価格案内を送信</button>
    </section>

    <section class="group">
      <div class="group-title">
        価格案内への回答状況
        <span class="group-count" id="offerResponseCount">0</span>
      </div>
      <select id="offerCampaignSelect" class="offer-campaign-select" aria-label="価格案内の送信回"></select>
      <div id="offerResponseList"></div>
    </section>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="emailPreview" class="email-preview" hidden>
  <div class="email-preview-card">
    <h2 id="emailPreviewTitle">発送メール（プレビュー）</h2>
    <p class="email-preview-note" id="emailPreviewNote">この画面はテスト確認用です。実際の送信はしていません。</p>
    <p class="email-preview-subject" id="emailPreviewSubject"></p>
    <pre id="emailPreviewBody"></pre>
    <p class="email-preview-links" id="emailPreviewLinks" hidden>
      <a id="emailPreviewSimulator" target="_blank" rel="noopener">シミュレーター</a>
      <a id="emailPreviewBuy" target="_blank" rel="noopener">購入する</a>
      <a id="emailPreviewHold" target="_blank" rel="noopener">保留</a>
      <a id="emailPreviewPass" target="_blank" rel="noopener">見送る</a>
    </p>
    <button type="button" id="emailPreviewClose">閉じる</button>
  </div>
</div>

<script>
const API_BASE = "";
const STORAGE_KEY = "satofarms_admin_secret";

function readAdminSecret() {
  try {
    return sessionStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY) || "";
  } catch {
    return "";
  }
}

function saveAdminSecret(secret) {
  sessionStorage.setItem(STORAGE_KEY, secret);
  try { localStorage.setItem(STORAGE_KEY, secret); } catch { /* ignore */ }
}

function clearAdminSecret() {
  sessionStorage.removeItem(STORAGE_KEY);
  try { localStorage.removeItem(STORAGE_KEY); } catch { /* ignore */ }
}

let adminSecret = readAdminSecret();

const el = (id) => document.getElementById(id);
const yen = (n) => "¥" + Number(n).toLocaleString("ja-JP");

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function shippingHtml(order) {
  const postal = order.shipping_postal_code ? "〒" + order.shipping_postal_code : "";
  const line = [postal, order.shipping_prefecture, order.shipping_address]
    .filter(Boolean)
    .join(" ");
  const parts = [];
  if (line) parts.push(escapeHtml(line));
  if (order.shipping_phone) parts.push("TEL " + escapeHtml(order.shipping_phone));
  if (!parts.length) {
    return '<span class="shipping-missing">注文時の届け先が記録されていません</span>';
  }
  return parts.join("<br>");
}

function showToast(message) {
  const t = el("toast");
  t.textContent = message;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2400);
}

function showEmailPreview(preview, options) {
  if (!preview) return;
  const opts = options || {};
  el("emailPreviewTitle").textContent = opts.title || "発送メール（プレビュー）";
  el("emailPreviewNote").textContent =
    opts.note || "この画面はテスト確認用です。実際の送信はしていません。";
  el("emailPreviewSubject").textContent = preview.subject || "";
  el("emailPreviewBody").textContent = preview.text || "";
  const urls = preview.urls || {};
  const links = el("emailPreviewLinks");
  const hasLinks = urls.simulatorUrl || urls.buyUrl || urls.holdUrl || urls.passUrl;
  links.hidden = !hasLinks;
  if (hasLinks) {
    el("emailPreviewSimulator").href = urls.simulatorUrl || "#";
    el("emailPreviewBuy").href = urls.buyUrl || "#";
    el("emailPreviewHold").href = urls.holdUrl || "#";
    el("emailPreviewPass").href = urls.passUrl || "#";
  }
  el("emailPreview").hidden = false;
}

el("emailPreviewClose").addEventListener("click", () => {
  el("emailPreview").hidden = true;
});

function formatDate(iso) {
  if (!iso) return "";
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "";
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23",
  }).formatToParts(date);
  const value = (type) => parts.find((part) => part.type === type)?.value || "";
  return value("year") + "-" + value("month") + "-" + value("day") + " " + value("hour") + ":" + value("minute");
}

async function tryLogin(secret) {
  const res = await fetch(API_BASE + "/api/admin/orders", {
    headers: { "X-Admin-Secret": secret },
  });
  if (res.status === 401) return false;
  const data = await res.json();
  if (!data.success) return false;
  return true;
}

el("loginBtn").addEventListener("click", async () => {
  const secret = el("secretInput").value.trim();
  if (!secret) return;
  el("loginBtn").disabled = true;
  el("loginBtn").textContent = "確認しています…";

  const ok = await tryLogin(secret);
  el("loginBtn").disabled = false;
  el("loginBtn").textContent = "ログイン";

  if (!ok) {
    el("loginError").classList.add("show");
    return;
  }
  el("loginError").classList.remove("show");
  adminSecret = secret;
  saveAdminSecret(secret);
  showMain();
});

el("secretInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") el("loginBtn").click();
});

el("logoutBtn").addEventListener("click", () => {
  adminSecret = "";
  clearAdminSecret();
  el("main").classList.remove("show");
  el("loginGate").style.display = "block";
  el("secretInput").value = "";
});

async function showMain() {
  el("loginGate").style.display = "none";
  el("main").classList.add("show");
  await loadAll();
}

async function loadAll() {
  await Promise.all([loadOrders(), loadMembers(), loadPriceOffers()]);
}

async function loadOrders() {
  try {
    const res = await fetch(API_BASE + "/api/admin/orders", {
      headers: { "X-Admin-Secret": adminSecret },
    });
    if (res.status === 401) {
      showToast("認証が切れました。再度ログインしてください。");
      el("logoutBtn").click();
      return;
    }
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    renderOrders(data.orders);
  } catch (err) {
    showToast("一覧の取得に失敗しました");
  }
}

const BROWN_SOURCE_LABEL = {
  "30kg": "玄米30kg",
  "20kg相当": "玄米20kg",
  "15kg相当": "玄米15kg",
  "10kg相当": "玄米10kg",
};

const MILLED_YIELD_KG = {
  "30kg": 27,
  "20kg相当": 18,
  "15kg相当": 13.5,
  "10kg相当": 9,
};

const BROWN_ACTUAL_KG = {
  "30kg": 30,
  "20kg相当": 19.5,
  "15kg相当": 14.5,
  "10kg相当": 9.5,
};

function productLabel(order) {
  if (!order.milled) {
    if (order.weight_label === "30kg") return "玄米30kg";
    const actual = order.actual_weight_kg ?? BROWN_ACTUAL_KG[order.weight_label];
    return "玄米" + order.weight_label + "(実質" + actual + "kg)";
  }
  const yieldKg = MILLED_YIELD_KG[order.weight_label];
  const brown = BROWN_SOURCE_LABEL[order.weight_label] || "玄米" + order.weight_label;
  return "標準精米（白米）実質" + yieldKg + "kg(" + brown + "を精米)";
}

function orderInfoHtml(order) {
  const name = order.recipient_name || "（宛名なし）";
  const notes = order.notes ? String(order.notes).trim() : "";
  const notesHtml = notes
    ? `<div class="notes">備考：${escapeHtml(notes)}</div>`
    : "";
  return `
      <div class="order-info">
        <div class="oid">No.${escapeHtml(order.id)}</div>
        <div class="member">${escapeHtml(name)}</div>
        <div class="shipping">${shippingHtml(order)}</div>
        <div class="product">${escapeHtml(productLabel(order))}</div>
        ${notesHtml}
        <div class="date">注文日時：${escapeHtml(formatDate(order.ordered_at))}</div>
      </div>`;
}

function renderOrders(orders) {
  const pending = orders.filter((o) => o.payment_status === "pending_payment");
  const preparing = orders.filter((o) => o.status === "preparing");

  el("pendingCount").textContent = pending.length;
  el("preparingCount").textContent = preparing.length;

  const pendingList = el("pendingList");
  pendingList.innerHTML = pending.length
    ? ""
    : '<p class="empty-note">支払い待ちの注文はありません。</p>';
  for (const o of pending) {
    const card = document.createElement("div");
    card.className = "order-card pending";
    card.innerHTML = `
      ${orderInfoHtml(o)}
      <div class="order-amount">${yen(o.total_amount)}</div>
      <button class="confirm-btn" data-id="${escapeHtml(o.id)}">入金確認</button>
    `;
    pendingList.appendChild(card);
  }

  const preparingList = el("preparingList");
  preparingList.innerHTML = preparing.length
    ? ""
    : '<p class="empty-note">発送準備中の注文はありません。</p>';
  for (const o of preparing) {
    const card = document.createElement("div");
    card.className = "order-card preparing";
    card.innerHTML = `
      ${orderInfoHtml(o)}
      <div class="order-side">
        <div class="order-amount">${yen(o.total_amount)}</div>
        <a class="print-btn" href="/admin/shipping-instruction.html?id=${encodeURIComponent(o.id)}" target="_blank" rel="noopener">指示書を印刷</a>
        <label class="tracking-field">
          <input class="tracking-input" type="text" inputmode="numeric" autocomplete="off" maxlength="40" placeholder="追跡番号（任意）" aria-label="追跡番号">
        </label>
        <button class="complete-btn" data-id="${escapeHtml(o.id)}">発送完了</button>
      </div>
    `;
    preparingList.appendChild(card);
  }

  document.querySelectorAll(".confirm-btn").forEach((btn) => {
    btn.addEventListener("click", () => confirmPayment(btn.dataset.id, btn));
  });
  document.querySelectorAll(".complete-btn").forEach((btn) => {
    btn.addEventListener("click", () => completeShipment(btn.dataset.id, btn));
  });
}

async function confirmPayment(orderId, btn) {
  const ok = confirm(`注文 No.${orderId} を入金確認済みにします。よろしいですか？`);
  if (!ok) return;

  btn.disabled = true;
  btn.textContent = "処理中…";

  try {
    const res = await fetch(API_BASE + `/api/admin/orders/${orderId}/paid`, {
      method: "POST",
      headers: { "X-Admin-Secret": adminSecret },
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "処理に失敗しました");

    showToast(`注文 No.${orderId} を発送準備OKにしました`);
    await loadOrders();
  } catch (err) {
    showToast(err.message);
    btn.disabled = false;
    btn.textContent = "入金確認";
  }
}

async function completeShipment(orderId, btn) {
  const ok = confirm(`注文 No.${orderId} を発送完了にします。よろしいですか？`);
  if (!ok) return;

  const card = btn.closest(".order-card");
  const trackingInput = card && card.querySelector(".tracking-input");
  const trackingNumber = trackingInput ? trackingInput.value.trim() : "";

  btn.disabled = true;
  btn.textContent = "処理中…";

  try {
    const res = await fetch(API_BASE + `/api/admin/orders/${orderId}/completed`, {
      method: "POST",
      headers: {
        "X-Admin-Secret": adminSecret,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ trackingNumber }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "処理に失敗しました");

    showToast(`注文 No.${orderId} を発送完了にしました`);
    showEmailPreview(data.emailPreview);
    await loadOrders();
  } catch (err) {
    showToast(err.message);
    btn.disabled = false;
    btn.textContent = "発送完了";
  }
}

function memberContact(member) {
  const email = String(member.email_original || "").trim();
  const phone = String(member.phone || "").trim();
  if (email && phone) return email + " ／ " + phone;
  return email || phone || "（連絡先なし）";
}

function intentLabel(intent) {
  if (intent === "lv1") return "Lv.1";
  if (intent === "lv2") return "Lv.2";
  if (intent === "lv3") return "Lv.3";
  return intent || "—";
}

async function loadMembers() {
  try {
    const res = await fetch(API_BASE + "/api/admin/members", {
      headers: { "X-Admin-Secret": adminSecret },
    });
    if (res.status === 401) {
      showToast("認証が切れました。再度ログインしてください。");
      el("logoutBtn").click();
      return;
    }
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    renderMembers(data.members || []);
  } catch (err) {
    showToast("事前登録者の取得に失敗しました");
  }
}

function renderMembers(members) {
  const lv1 = members.filter((m) => m.purchase_intent === "lv1").length;
  const lv2 = members.filter((m) => m.purchase_intent === "lv2").length;
  const lv3 = members.filter((m) => m.purchase_intent === "lv3").length;

  el("memberCount").textContent = members.length;
  el("lv1Count").textContent = lv1;
  el("lv2Count").textContent = lv2;
  el("lv3Count").textContent = lv3;

  const list = el("memberList");
  list.innerHTML = members.length
    ? ""
    : '<p class="empty-note">事前登録者はまだいません。</p>';

  for (const m of members) {
    const card = document.createElement("div");
    card.className = "order-card member";
    card.innerHTML = `
      <div class="order-info">
        <div class="member">${escapeHtml(m.name || "（名前なし）")}</div>
        <div class="product">${escapeHtml(memberContact(m))}</div>
        <div class="date">登録日時：${escapeHtml(formatDate(m.created_at))}</div>
      </div>
      <span class="status-tag">${escapeHtml(intentLabel(m.purchase_intent))}</span>
    `;
    list.appendChild(card);
  }
}

function offerIntentLabel(intent) {
  if (intent === "lv1") return "Lv.1";
  if (intent === "lv2") return "Lv.2";
  if (intent === "lv3") return "Lv.3";
  return intent || "—";
}

function offerCampaignLabel(campaign) {
  const when = formatDate(campaign.created_at) || "日時不明";
  return when + "　" + offerIntentLabel(campaign.target_intent) + "　段階" + (campaign.price_stage || "—");
}

async function loadPriceOfferPreview() {
  const res = await fetch(API_BASE + "/api/admin/price-offers/preview?target=lv3", {
    headers: { "X-Admin-Secret": adminSecret },
  });
  if (res.status === 401) {
    showToast("認証が切れました。再度ログインしてください。");
    el("logoutBtn").click();
    return null;
  }
  const data = await res.json();
  if (!data.success) throw new Error(data.error);

  el("offerPreview").textContent =
    "現在の段階 " + (data.priceStage || "—") +
    "　／　Lv.3 " + Number(data.memberCount || 0) + "人" +
    "　／　送信対象（メールあり） " + Number(data.withEmailCount || 0) + "人" +
    "　／　メールなし " + Number(data.withoutEmailCount || 0) + "人";

  if (data.lastCampaign) {
    el("offerLastSend").textContent =
      "前回送信：" + formatDate(data.lastCampaign.created_at) +
      "　段階" + (data.lastCampaign.price_stage || "—") +
      "　" + Number(data.lastCampaign.sent_count || 0) + "通";
  } else {
    el("offerLastSend").textContent = "前回送信：まだありません";
  }
  return data;
}

function renderOfferResponses(campaigns, campaignId, recipients) {
  const select = el("offerCampaignSelect");
  const previous = campaignId || select.value;
  select.innerHTML = "";
  if (!campaigns.length) {
    const option = document.createElement("option");
    option.value = "";
    option.textContent = "まだ送信していません";
    select.appendChild(option);
    select.disabled = true;
  } else {
    select.disabled = false;
    for (const campaign of campaigns) {
      const option = document.createElement("option");
      option.value = campaign.id;
      option.textContent = offerCampaignLabel(campaign);
      select.appendChild(option);
    }
    if (previous && [...select.options].some((o) => o.value === previous)) {
      select.value = previous;
    }
  }

  el("offerResponseCount").textContent = recipients.length;
  const list = el("offerResponseList");
  list.innerHTML = recipients.length
    ? ""
    : '<p class="empty-note">この回の回答はまだありません。</p>';

  for (const row of recipients) {
    const card = document.createElement("div");
    card.className = "order-card offer";
    const sendLabel =
      row.send_status === "sent" ? "送信済み" :
      row.send_status === "failed" ? "送信失敗" :
      row.send_status === "skipped" ? "対象外" : "未送信";
    const when = row.responded_at
      ? "回答日時：" + formatDate(row.responded_at)
      : "未回答";
    card.innerHTML = `
      <div class="order-info">
        <div class="member">${escapeHtml(row.name || "（名前なし）")}</div>
        <div class="product">${escapeHtml(row.email || "（メールなし）")}　／　${escapeHtml(sendLabel)}</div>
        <div class="date">${escapeHtml(when)}</div>
      </div>
      <span class="status-tag">${escapeHtml(row.statusLabel || "未回答")}</span>
    `;
    list.appendChild(card);
  }
}

async function loadPriceOffers(campaignId) {
  try {
    await loadPriceOfferPreview();
    const query = campaignId ? ("?campaignId=" + encodeURIComponent(campaignId)) : "";
    const res = await fetch(API_BASE + "/api/admin/price-offers" + query, {
      headers: { "X-Admin-Secret": adminSecret },
    });
    if (res.status === 401) {
      showToast("認証が切れました。再度ログインしてください。");
      el("logoutBtn").click();
      return;
    }
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    renderOfferResponses(data.campaigns || [], data.campaignId, data.recipients || []);
  } catch (err) {
    el("offerPreview").textContent = "価格案内の情報を取得できませんでした。";
    showToast("価格案内の取得に失敗しました");
  }
}

el("offerCampaignSelect").addEventListener("change", () => {
  const campaignId = el("offerCampaignSelect").value;
  if (campaignId) loadPriceOffers(campaignId);
});

el("sendLv3OfferBtn").addEventListener("click", async () => {
  const btn = el("sendLv3OfferBtn");
  if (btn.disabled) return;

  let preview;
  try {
    preview = await loadPriceOfferPreview();
  } catch (err) {
    showToast("送信対象を確認できませんでした");
    return;
  }
  if (!preview) return;

  const count = Number(preview.withEmailCount || 0);
  if (!count) {
    window.alert("送信できるメールアドレスの Lv.3 会員がいません。");
    return;
  }

  let message =
    "Lv.3の会員 " + count + "人に、現在の段階" + (preview.priceStage || "—") +
    "の価格案内を送信します。よろしいですか？";
  if (preview.lastCampaign) {
    message += "\n前回の送信は " + formatDate(preview.lastCampaign.created_at) + " です。";
  }
  if (!window.confirm(message)) return;

  btn.disabled = true;
  btn.textContent = "送信しています…";
  try {
    const res = await fetch(API_BASE + "/api/admin/price-offers", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Admin-Secret": adminSecret,
      },
      body: JSON.stringify({ targetIntent: "lv3" }),
    });
    const data = await res.json();
    if (res.status === 401) {
      showToast("認証が切れました。再度ログインしてください。");
      el("logoutBtn").click();
      return;
    }
    if (!data.success) throw new Error(data.error || "送信に失敗しました");
    showToast(
      data.previewOnly
        ? "プレビュー送信しました（実メールは送っていません）"
        : "送信しました（成功 " + data.sent + " / 失敗 " + data.failed + "）"
    );
    if (data.emailPreview) {
      showEmailPreview(data.emailPreview, {
        title: "価格案内メール（プレビュー）",
        note: data.previewOnly
          ? "実メールは送っていません。下のリンクで、会員と同じ操作を確認できます。"
          : "送信したメールの内容です。",
      });
    }
    await loadPriceOffers(data.campaignId);
  } catch (err) {
    showToast(err.message || "送信に失敗しました");
  } finally {
    btn.disabled = false;
    btn.textContent = "Lv.3へ価格案内を送信";
  }
});

el("refreshBtn").addEventListener("click", loadAll);

(async function init() {
  if (adminSecret) {
    const ok = await tryLogin(adminSecret);
    if (ok) {
      saveAdminSecret(adminSecret);
      showMain();
      return;
    }
    clearAdminSecret();
    adminSecret = "";
  }
})();
</script>
